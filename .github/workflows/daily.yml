name: Daily build

# 6am EASTERN, every day (his call 2026-09-12). GitHub schedules in UTC only,
# so this fires at both 10:00 and 11:00 UTC and the job decides which run is
# the day's build -- that keeps one run a day across daylight saving instead of
# drifting an hour twice a year.
#
# IT USED TO DEMAND THE HOUR BE EXACTLY 6 (his catch 2026-09-27: "yesterday's
# games didn't seem to load"). GitHub runs a scheduled job when it has room,
# and from 2026-09-25 it was handing these out three and four hours late, so
# every run woke at 9, 10 or 11am, failed the test and skipped -- three days
# with no build at all and nobody to say so. The rule now is the one he
# actually wants: build on the first run of the NY day at or after 6am that
# has not already built.
#
# IT ALSO HAS TO FIX ITSELF (his call 2026-09-27: "can you just automatically
# handle it when it fails"). So the day gets FIVE chances rather than two, and
# because each run builds only if the day has not been built yet, the extra
# ones cost nothing on a normal day and quietly catch up on a bad one -- a
# late hand-out from GitHub, a dead ESPN response, a half-second network
# blip. The site itself carries a build stamp, so a build always leaves a
# commit behind and the check below can never mistake a silent failure for a
# day's work already done.
on:
  schedule:
    # Asked for hours EARLY on purpose. Through late September GitHub was
    # handing this account's scheduled runs out four and five hours late in
    # both repos, and on 28 September none fired at all before 8am Eastern.
    # Delayed, these land in the morning; run on time they arrive at 1, 2 and
    # 3am Eastern and the "before 6am" test below drops them, so being wrong
    # about the delay costs nothing.
    - cron: "13 5 * * *"
    - cron: "11 6 * * *"
    - cron: "7 7 * * *"
    - cron: "0 10 * * *"      # 6am EDT / 5am EST -- the intended one
    - cron: "0 11 * * *"      # 7am EDT / 6am EST
    - cron: "0 13 * * *"      # and three catch-up runs, for a day that broke
    - cron: "0 16 * * *"
    - cron: "0 20 * * *"
  workflow_dispatch:          # the Run workflow button, any time

permissions:
  contents: write             # the job commits the rebuilt site

concurrency:
  group: daily-build
  cancel-in-progress: false   # never let two builds race to push

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # the history is needed to see whether today's build already ran
      - uses: actions/checkout@v4
        with:
          fetch-depth: 30

      - name: Has today's build run yet?
        id: clock
        run: |
          today=$(TZ=America/New_York date +%Y-%m-%d)
          hour=$(TZ=America/New_York date +%H)
          echo "New York: $today, hour $hour"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "go=yes" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$((10#$hour))" -lt 6 ]; then
            echo "before 6am -- leaving it to the later run"
            echo "go=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git log -30 --format=%s | grep -q "^Daily build $today"; then
            echo "already built today -- skipping"
            echo "go=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "go=yes" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.clock.outputs.go == 'yes'
        with:
          python-version: "3.12"

      - name: Install requests
        if: steps.clock.outputs.go == 'yes'
        run: pip install requests

      # THE CACHE IS THE WHOLE POINT. Finished seasons are written to cache/
      # and never re-fetched (harvest's season_over gate), so with this restored
      # the daily run only pulls the CURRENT season plus the upcoming week.
      # Without it every run would re-download fifteen years from ESPN.
      - name: Restore the ESPN cache
        id: cache
        if: steps.clock.outputs.go == 'yes'
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: espn-cache-${{ github.run_id }}
          restore-keys: |
            espn-cache-

      # ...and one flaky ESPN response should not cost the day a build: try
      # again a minute later before giving the day up to the next catch-up run
      - name: Harvest
        if: steps.clock.outputs.go == 'yes'
        run: python harvest.py || (echo "harvest failed -- trying once more" && sleep 60 && python harvest.py)

      # new teams get a wash colour without being asked for (his standing
      # question, settled 2026-09-12)
      - name: Refresh colours
        if: steps.clock.outputs.go == 'yes'
        run: python colors.py --write

      - name: Build the site
        if: steps.clock.outputs.go == 'yes'
        run: python site.py

      # docs/tags.json is the app's own shared state, written from the page
      # through the GitHub API. The build never touches it and neither does
      # this commit -- it is deliberately NOT in the add list below.
      - name: Commit and push
        if: steps.clock.outputs.go == 'yes'
        run: |
          git config user.name "games-history bot"
          git config user.email "actions@github.com"
          git add docs/app.js docs/games.json docs/colors.json docs/crests.json \
                  docs/index.html docs/sw.js docs/manifest.webmanifest \
                  output/colors.json output/crests.json data/uscho data/nfl-key.json data/nfl-seeds.json data/pro-seeds.json data/mlb-walkoff.json data/mlb-lines.json data/conf-map.json data/kickoff.json data/final-rank.json data/conf-place.json || true
          if git diff --cached --quiet; then
            echo "nothing changed"
            exit 0
          fi
          git commit -m "Daily build $(TZ=America/New_York date '+%Y-%m-%d %H:%M %Z')"
          # someone may have tagged a game from the page while this ran
          git pull --rebase --autostash origin main
          git push origin HEAD:main

      # ALWAYS save, even if harvest failed partway: a cold run that dies on
      # one bad ESPN response must not throw away the 300 files it did fetch
      # (2026-09-13).
      - name: Save the ESPN cache
        if: always() && steps.clock.outputs.go == 'yes'
        uses: actions/cache/save@v4
        with:
          path: cache
          key: espn-cache-${{ github.run_id }}
