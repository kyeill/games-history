<!doctype html><html lang="en"><head><meta charset="utf-8">
<title>Games History icon options</title>
<style>
body{margin:0;background:#16161a;color:#ececea;
  font-family:"Source Sans 3",system-ui,-apple-system,sans-serif;padding:26px}
h1{font-size:21px;margin:0 0 4px;color:#ececea}
p.sub{color:#9a9a95;margin:0 0 24px;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
  gap:18px;max-width:1000px}
figure{margin:0;background:#1e1e23;border:1px solid #2b2b31;border-radius:10px;
  padding:16px}
.pair{display:flex;align-items:flex-end;gap:14px}
img{border-radius:22%;display:block}
figcaption{margin-top:12px;display:flex;flex-direction:column;gap:3px}
figcaption b{color:#ececea;font-size:14px}
figcaption span{color:#9a9a95;font-size:12.5px;line-height:1.35}
</style></head><body>
<h1>Games History &mdash; icon options</h1>
<p class="sub">Each shown at 120px and at 44px. The small one is the test:
that is roughly how big it renders on a home screen and in a browser tab.</p>
<div class="grid"><figure><div class="pair"><img src="calendar-grid-192.png" width="120" height="120" alt=""><img src="calendar-grid-44.png" width="44" height="44" alt=""></div><figcaption><b>calendar-grid</b><span>Calendar page, 3x3 grid, one day picked out in maize.</span></figcaption></figure><figure><div class="pair"><img src="calendar-date-192.png" width="120" height="120" alt=""><img src="calendar-date-44.png" width="44" height="44" alt=""></div><figcaption><b>calendar-date</b><span>Calendar page reduced to a single date block.</span></figcaption></figure><figure><div class="pair"><img src="scoreboard-192.png" width="120" height="120" alt=""><img src="scoreboard-44.png" width="44" height="44" alt=""></div><figcaption><b>scoreboard</b><span>The app's own card: two team rows, winner washed maize.</span></figcaption></figure><figure><div class="pair"><img src="bracket-192.png" width="120" height="120" alt=""><img src="bracket-44.png" width="44" height="44" alt=""></div><figcaption><b>bracket</b><span>A bracket fork, maize on the advancing side.</span></figcaption></figure><figure><div class="pair"><img src="ticket-192.png" width="120" height="120" alt=""><img src="ticket-44.png" width="44" height="44" alt=""></div><figcaption><b>ticket</b><span>A ticket stub with torn notches.</span></figcaption></figure><figure><div class="pair"><img src="clock-slot-192.png" width="120" height="120" alt=""><img src="clock-slot-44.png" width="44" height="44" alt=""></div><figcaption><b>clock-slot</b><span>A clock face with maize hands -- the TV window.</span></figcaption></figure></div>
</body></html>
