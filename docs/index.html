<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Games History</title>
<meta name="theme-color" content="#16161a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
:root{
  --bg:#16161a; --card:#1e1e23; --ink:#ececea; --muted:#9a9a95;
  --line:#2b2b31; --rank:#8fb0d8; --accent:#e0834f; --ok:#7fb98a;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none}
.wrap{max-width:1180px;margin:0 auto;padding:0 14px 90px}

/* h1 and the count share a baseline, so both need the SAME line-height --
   otherwise flex computes the baseline off different boxes and the count
   rides low against the title. */
header{display:flex;align-items:baseline;gap:9px;padding:18px 0 10px}
h1{font-size:22px;margin:0;letter-spacing:-.2px;font-weight:700;line-height:1.2}
.count{color:var(--muted);font-size:13.5px;font-variant-numeric:tabular-nums;
  line-height:1.2}
.spacer{flex:1}
.iconbtn{background:none;border:1px solid var(--line);color:var(--muted);
  border-radius:7px;padding:4px 9px;font:inherit;font-size:13px;cursor:pointer}
.iconbtn:hover{color:var(--ink);border-color:#3b3b43}
.iconbtn:focus-visible{outline:2px solid var(--rank);outline-offset:2px}

nav{position:sticky;top:0;z-index:6;background:var(--bg);display:flex;gap:2px;
  border-bottom:1px solid var(--line);margin-bottom:10px}
nav button{flex:1;background:none;border:0;border-bottom:2px solid transparent;
  color:var(--muted);font:inherit;font-size:14.5px;font-weight:600;
  padding:9px 4px;cursor:pointer}
nav button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
nav button:focus-visible{outline:2px solid var(--rank);outline-offset:-2px}

/* the two populations within a sport -- a segmented control, not more tabs,
   so the sport stays put while he switches which view of it he is reading */
.viewbar{display:inline-flex;gap:0;margin:0 0 12px;border:1px solid var(--line);
  border-radius:8px;overflow:hidden;background:var(--card)}
.viewbar button{background:none;border:0;color:var(--muted);font:inherit;
  font-size:13.5px;font-weight:600;padding:6px 16px;cursor:pointer}
.viewbar button[aria-selected="true"]{background:#2e3a48;color:#cfe0f2}
/* five views on Detroit (2026-09-18): no name breaks in two, and on a phone
   the buttons tighten up so the row fits */
.viewbar button{white-space:nowrap}
@media (max-width:480px){.viewbar button{padding:6px 10px;font-size:13px}}
.viewbar button:focus-visible{outline:2px solid var(--rank);outline-offset:-2px}

.filters{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.f{border:1px solid var(--line);background:var(--card);color:var(--muted);
  border-radius:999px;padding:3px 11px;font:inherit;font-size:13px;
  cursor:pointer;white-space:nowrap}
.f[aria-pressed="true"]{background:#2e3a48;border-color:#3f5064;color:#cfe0f2}
.f:focus-visible{outline:2px solid var(--rank);outline-offset:2px}
.fgroup{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.fsel{background:var(--card);border:1px solid var(--line);color:var(--ink);
  border-radius:999px;padding:4px 10px;font:inherit;font-size:13px;
  max-width:210px;cursor:pointer}
.fsel:focus-visible{outline:2px solid var(--rank);outline-offset:2px}
.flabel{font-size:11px;text-transform:uppercase;letter-spacing:.07em;
  color:var(--muted);font-weight:700;margin-right:2px}
/* the quick-action group carries no label, so it must not keep the gap */
.flabel:empty{margin-right:0}

/* one column on a phone, two from 900px -- the gap replaces the row margin */
#list{display:grid;grid-template-columns:1fr;gap:8px;align-content:start}
@media (min-width:900px){#list{grid-template-columns:1fr 1fr;gap:9px}}
/* Three across once there is room for it. The card gives up width in the
   places that were padding rather than content: the gutter to the meta
   column, the card's own side padding, and the meta column's floor. */
@media (min-width:1240px){
  #list{grid-template-columns:repeat(3,1fr);gap:9px}
  #list .row{padding:10px 11px;column-gap:10px}
  #list .meta{min-width:72px;padding-left:10px}
}
#list .empty{grid-column:1/-1}

.row{display:grid;background:var(--card);border:1px solid var(--line);
  border-radius:9px;padding:10px 13px;
  grid-template-columns:1fr auto;
  /* meta occupies ONLY the teams row, so its two rows can be made to match
     the two team lines exactly. Spanning the header row too put it 64px out. */
  grid-template-areas:"sport sport" "teams meta" "tags tags";
  /* align-content:start is what makes the meta column line up. A card is
     stretched to the height of the tallest card beside it, and the default
     align-content:stretch spreads that slack across ALL THREE tracks -- so
     the teams row grew ~10px taller than the team lines and meta's 1fr/1fr
     split no longer matched them. Sending the slack to the bottom instead
     keeps every track at its content height. */
  column-gap:14px;align-items:start;align-content:start}
/* week + date, where the sport label used to be */
/* The header row carries the slot label at the left and the DATE at the
   right, where it lines up with the network and time in the column below. */
.sport{grid-area:sport;display:flex;align-items:baseline;
  justify-content:space-between;gap:10px;
  font-size:13px;font-weight:400;letter-spacing:.05em;
  text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.hdate{flex:none;font-size:13px;font-weight:400;letter-spacing:0;
  text-transform:none;color:var(--muted);font-variant-numeric:tabular-nums}
/* the week takes the header's colour, tinted or plain -- no orange of its own
   (his call: an untinted header should read entirely plain) */
.teams{grid-area:teams;display:flex;flex-direction:column;gap:3px}
.tl{display:grid;grid-template-columns:22px 20px 1fr auto;align-items:center;
  gap:8px;padding:2px 6px 2px 7px;margin-left:-7px;border-radius:5px}
.tl.won{background:var(--winwash)}
/* a Rivals loss that matters fills the whole card (his call 2026-09-17) */
.row.rwash{background:var(--winwash)}
.row.rwash .tl.won{background:transparent}
/* A coloured border marks a result he wants to see: Michigan won (maize), or a
   rival lost (the colour of whoever beat them). A full maize box was too loud,
   so the winner's line keeps its own wash and only the frame carries the flag.
   Both colours are computed per row in app.js -- do NOT hardcode maize here,
   which is exactly the bug that made every border look like a Michigan win. */
.row.celebrate{border-color:var(--celeb,#ffcb05);
  box-shadow:0 0 0 1px var(--celebring,#ffcb0544)}
.row.celebrate:hover{filter:brightness(1.12)}
/* a Michigan loss on the other views: dashed, never mistaken for a grey
   winner. The Michigan view keeps a plain frame (his calls 2026-09-11) */
.row.celebrate.mloss{border-style:dashed;box-shadow:none}
/* a rival won, or Michigan lost: both team lines go italic */
/* a rival won, or Michigan lost: the WINNER's name is struck through -- no
   italics anywhere any more (his call 2026-09-11) */
/* only a team that beat MICHIGAN is struck through (his call 2026-09-12) --
   a rival beating anyone else still greys the rankings, but is not struck */
.row.struck .tl.won .nm,.row.mich.dimmed .mn{font-style:normal;
  text-decoration:line-through;text-decoration-thickness:1.5px}
.crest{width:21px;height:21px;object-fit:contain;display:block}
/* the ranking is CENTRED in its column (his call 2026-09-11), so a one-digit
   ranking sits under the middle of a two-digit one rather than hard right */
.rk{color:var(--rank);font-size:12.5px;font-weight:600;
  font-variant-numeric:tabular-nums;text-align:center}
.rk:not(:empty)::before{content:"#"}
/* the ranking lines up on its VISUAL MIDDLE with the name (his call
   2026-09-11, after trying the shared baseline) -- .tl centres every cell */
/* rankings: orange on an upset (Sports Daily's accent); grey when Michigan
   lost or Ohio State / Michigan State / Notre Dame won */
.row.rk-upset .rk{color:var(--accent)}
.row.rk-grey .rk{color:var(--muted)}
/* the CFP and the NCAA Tournament say "NO. 3" (his calls 2026-09-11). Every
   card shares the 44px rank column, so names start in one place and the last
   digit of "#10" and "NO. 11" line up; a playoff seed holds two digits' width,
   so "NO." never moves and "NO. 2" just leaves room after the number */
/* A postseason seed reads in front of the name, in the ranking's colours. Its
   box is the width of the rank column it replaces, with the digits right
   aligned and the column itself dropped -- so both names on a card start
   together, and in the same place as on every non-postseason card. */
.rkin{color:var(--rank);font-size:12.5px;font-weight:600;
  font-variant-numeric:tabular-nums;
  display:inline-block;min-width:20px;text-align:right;margin-right:8px}
.row.rk-no .rk{display:none}
/* a conference-tournament card's poll ranking, after the name (2026-09-16) */
.rkaft{margin-left:6px;font-size:12px;font-weight:400;color:var(--muted);
  /* its own box, so a struck-through name does not strike the ranking after
     it (his call 2026-09-18) */
  display:inline-block;text-decoration:none}
.row.rk-no .tl{grid-template-columns:22px minmax(0,1fr) auto}
/* In the Michigan view the seed is just another character in the line (his
   call 2026-09-11): the name size, no box, no padding -- "vs. 4 ALABAMA". The
   other views keep the fixed, right-aligned box, which is what lines their two
   stacked names up. */
.row.mich .rkin{display:inline;min-width:0;margin-right:0;font-size:inherit;
  text-align:inherit}
.row.rk-upset .rkin{color:var(--accent)}
.row.rk-grey .rkin{color:var(--muted)}
.nm{font-size:15.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tl.won .nm{font-weight:600}
/* on TV Windows a rival win carries no bold either (his calls 2026-09-12) --
   the view is a record of what was on, not a scoreboard of their results. One
   that beat Michigan is struck through as well: line, no weight. */
.row.flatwin .tl.won .nm{font-weight:400}
/* ...and BOTH teams' scores lose their bold on the same cards (his call
   2026-09-12): every rival win and every Michigan loss, not just the losses.
   flatwin is only ever set on TV Windows, so the same games keep their bold
   scores on Key Games and Rivals. */
.row.flatwin .sc{font-weight:400}
/* CAVALIERS AGAINST PISTONS: not even the seeds bold (his call 2026-09-18) */
.row.nobold *{font-weight:400!important}
/* overtime: the winning score is underlined, instead of an OT chip */
.row.ot .tl.won .sc{text-decoration:underline;text-underline-offset:3px;
  text-decoration-thickness:2px}
.tl:not(.won) .nm,.tl:not(.won) .sc{color:#a5a5a0}
.sc{font-size:16px;font-variant-numeric:tabular-nums;font-weight:600;
  min-width:30px;text-align:right}
/* just the kickoff time now -- the network moved back to the bottom left */
/* Network on the away team's line, time on the home team's. Same row count
   and gap as .tl, so the two columns line up exactly. */
/* Two rows against the two team lines: network on the away line, time on the
   home line. The date is NOT here -- it sits in the header row above, which is
   the only way it can align with the header. */
.meta{grid-area:meta;padding-left:14px;border-left:1px solid var(--line);
  min-width:92px;align-self:stretch;display:grid;grid-template-rows:1fr 1fr;gap:3px}
.mrow{display:flex;align-items:center;justify-content:flex-end;
  font-size:13px;color:var(--ink);font-variant-numeric:tabular-nums}
.tags{grid-area:tags;display:flex;flex-wrap:wrap;gap:5px;margin-top:9px;
  align-items:center}
.tags:empty{display:none}
.tag{font-size:11.5px;border-radius:4px;padding:2px 7px;letter-spacing:.02em;
  border:1px solid transparent;white-space:nowrap}
/* TV window chips carry the network's own colour: FOX yellow, CBS a lighter
   blue, NBC grey, ABC a darker blue. Anything else (ESPN, Peacock) keeps the
   default slate. */
.t-slot{background:#232f3a;border-color:#31414f;color:#a9c6dd}
.t-slot.n-fox{background:#3a3218;border-color:#584a1d;color:#e8c766}
.t-slot.n-cbs{background:#1b3340;border-color:#2b4d61;color:#8fc9e4}
.t-slot.n-nbc{background:#2c2c31;border-color:#414147;color:#bcbcb7}
.t-slot.n-abc{background:#1b2440;border-color:#2b3860;color:#93a9dc}
.t-slot.n-espn{background:#3a1d1f;border-color:#5a2c2f;color:#e69a9a}
.t-big{background:#33261f;border-color:#4a382c;color:#e0a983}
/* conference championship / event name / neutral-site location -- BLUE,
   his call 2026-09-09 (it was purple) */
.t-champ{background:#1b2a40;border-color:#2c4265;color:#9dbde8}
.t-mine{background:#1f2e28;border-color:#2f4539;color:#9ecab0}
.t-mine.g-yellow{background:#3a3218;border-color:#584a1d;color:#e8c766}
.t-mine.g-red{background:#3a1d1f;border-color:#5a2c2f;color:#e69a9a}
.t-mine.g-grey{background:#2c2c31;border-color:#414147;color:#bcbcb7}
.t-grey{background:#2c2c31;border-color:#414147;color:#bcbcb7}
/* MICHIGAN view (trial, 2026-09-11): the header (TV details after a bar unless
   a window label fills it; stage cards put the day beside the date), one
   opponent line -- a colour stripe from the crest through the rating, then the
   score and Michigan's rank in uniform-coloured boxes -- and one chip row */
.row.mich{grid-template-columns:1fr;grid-template-areas:"sport" "teams" "tags"}
.row.mich .sport{flex-wrap:wrap;row-gap:2px;justify-content:flex-start}
/* the date is piped onto the end of the header rather than pinned to the right
   edge (his call 2026-09-11), so it takes the header style: same size, same
   colour, uppercase, same letter-spacing. Tabular figures stay. */
.row.mich .hdate{text-transform:uppercase;letter-spacing:.05em;padding-right:0;
  color:inherit}
.row.mich .mnum{text-transform:none}
/* THE LIONS' header is a TV Windows header (his call 2026-09-18): the date
   pinned to the far right in its own quieter style */
.row.mich.mich-nfl .sport{justify-content:space-between;flex-wrap:nowrap}
.row.mich.mich-nfl .hdate{text-transform:none;letter-spacing:0;color:var(--muted)}
/* an NFL playoff opponent's seed sits bare in the rank column -- no "#" */
.row.mich.mich-nfl .rk::before,.row.mich.mich-nhl .rk::before,
.row.mich.mich-nba .rk::before,.row.mich.mich-mlb .rk::before{content:none}
/* ...and an NFL playoff LOSS greys the opponent's seed (his call 2026-09-18) */
.row.mich.dimmed .nseed{color:var(--muted)}
.row.mich.ncaaloss .rk,.row.mich.ncaaloss .rn,.row.mich.ncaaloss .rkin{color:var(--muted)}
/* THE TIGERS' REGULAR SEASON: the opponent's colour runs the whole line,
   through the score, which sits on it bare (his call 2026-09-18) */
.row.mich.mreg .tl.won{background:var(--winwash);border-radius:5px;margin-left:-7px;
  padding-left:7px;padding-right:8px}
.row.mich.mreg .tl.won .mstripe{background:transparent}
.row.mich.mreg .tl .sc.mbox{background:transparent!important;color:var(--ink)!important;
  min-width:0;padding:0;font-weight:700}
/* NBC's chip stands out a little more on the Lions' cards */
.row.mich.mich-nfl .t-slot.n-nbc{background:#3b3b44;border-color:#63636e;color:#ecece6}
/* the day beside a stage card's date goes up in capitals (his call) */
.row.mich .hdow{text-transform:uppercase}
/* the champion caret never takes the strikethrough (his call): an
   inline-block is not decorated by its ancestor */
.row.mich .mcaret{margin-left:1px;font-style:normal;font-weight:600;
  display:inline-block;text-decoration:none}
.row.mich .tl{grid-template-columns:minmax(0,1fr) auto;column-gap:6px;
  padding:0;margin-left:0;background:none}
/* the stripe: crest, a rank column that holds exactly "NO. 16" (35.4px
   measured in Source Sans 3), then the name and rating. It stops before the
   boxes (his call). */
/* ONE HEIGHT, 26px, for the stripe and both boxes (his call 2026-09-11), so
   the score lines up with the highlight top and bottom. The stripe carries no
   vertical padding: with border-box the 26px is all content, and the tallest
   thing in it (the name line, 22.5px) still centres with room. */
/* The RANK and the RATING sit on the name's baseline (his call 2026-09-13),
   so the bottoms line up rather than the middles -- the smaller type then
   reads as sitting under the name rather than floating beside it. The crest
   has no baseline, so it keeps to the centre. */
.row.mich .mstripe{display:grid;grid-template-columns:22px 20px minmax(0,1fr);
  column-gap:7px;align-items:baseline;align-content:center;min-width:0;
  height:26px;padding:0 6px 0 7px;margin-left:-7px;border-radius:5px}
.row.mich .mstripe .crest{align-self:center}
.row.mich .tl.won .mstripe{background:var(--winwash)}
/* name then rating: the name shortens first, the rating stays whole */
/* every piece of the team line centres against the name (his call
   2026-09-11): the rating, the seed, the rank */
.row.mich .nm.mnm{display:flex;align-items:baseline;min-width:0}
.row.mich .mn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.row.mich .mfin{flex:none;margin-left:6px;font-size:12px;font-weight:400;
  color:var(--muted);font-style:normal}
/* the score (jersey) and Michigan's rank (pants): one height, one type size;
   the accessories colour is the text (inline styles) */
/* both boxes are sized for their widest reading (his call 2026-09-11): the
   score for 121-108, the rank for a hash and two digits (#25 measured 39px,
   which stretched a 2ch box). Tabular figures make 1ch a
   digit, so the widths hold whatever the numbers are. */
.row.mich .sc.mbox,.row.mich .mrank{display:inline-flex;align-items:center;
  justify-content:center;box-sizing:border-box;height:26px;padding:0 8px;
  border-radius:4px;font-size:14.5px;font-weight:400;
  font-variant-numeric:tabular-nums;white-space:nowrap}
.row.mich .sc.mbox{min-width:calc(7.2ch + 16px)}
/* an unplayed game: the box keeps its size so the card does not jump, but
   carries no colour and no number (his call 2026-09-12) */
/* football never reaches three digits, so its score box is narrower */
.row.mich.mich-cfb .sc.mbox{min-width:calc(5.4ch + 16px)}
/* hockey: overtime, a shootout or a tie underlines the score, and a shootout
   reads "2-2 (SO)" -- so its boxes are sized for that */
.row.mich .sc.mbox.u{text-decoration:underline;text-underline-offset:3px}
/* a loss score is italic (his call 2026-09-17) */
.row.mich .sc.mbox.l,.row.mich .mrank.l{font-style:italic}
/* a regular-season win as #1 UNDERLINES the number -- bold widened the box
   (his calls 2026-09-18) */
.row.mich .mrank.b{text-decoration:underline;text-underline-offset:3px}
.row.mich.mich-chk .sc.mbox,.row.mich.mich-chk .mrank{min-width:calc(8.4ch + 16px)}
/* no background here any more (his call 2026-09-13): an unfilled box is
   painted grey inline, so a game with no uniform cannot inherit maize */
.row.mich .mrank{min-width:calc(7.2ch + 16px)}
.row.mich.mich-cfb .mrank{min-width:calc(5.4ch + 16px)}
/* a postseason win or a win over a rival washes the whole card */
.row.mich.mwash{background:var(--winwash)}
.row.mich.mwash .tl.won .mstripe{background:transparent}
/* the detail row reads like the header -- plain grey text, no chips (his call
   2026-09-11): finish, location, event, series, shows, his Big Ten note */
/* the third row: his details at the left, Michigan's rank box at the right,
   under the score and the same width as it (his call 2026-09-11) */
.row.mich .tags.mdets{display:grid;grid-template-columns:minmax(0,1fr) auto;
  gap:6px;align-items:center;font-size:13px;font-weight:400;letter-spacing:.05em;
  text-transform:none;color:var(--muted);margin-top:5px}
/* HE WAS THERE (his call 2026-09-13): a maize asterisk under the crest, on
   the third row, grey when Michigan lost. Absolutely placed so it cannot
   disturb the detail text or the rank box beside it. */
.row.mich .tags.mdets{position:relative}
.row.mich .mstar{position:absolute;left:0;top:50%;transform:translateY(-50%);
  width:22px;text-align:center;color:#ffcb05;font-weight:700;font-size:16px;
  line-height:1}
.row.mich.dimmed .mstar{color:#8a8a92}
/* a hockey series card: the team's own rank, under the opponent's rank column
   (22px crest + 7px gap = 29px in, 20px wide) */
.row.mich .mrk2{position:absolute;left:29px;top:50%;transform:translateY(-50%);
  width:20px;text-align:center;font-size:12.5px;font-weight:600;
  letter-spacing:normal;font-variant-numeric:tabular-nums;line-height:inherit}
/* ...the SAME TYPE as the opponent's rank above it (12.5px, none of the
   footer's letter-spacing), on the footer's line height so the two share a
   baseline (his catches 2026-09-17: it sat low, then read wide) */
.row.mich .mdl{display:flex;flex-wrap:wrap;gap:7px;align-items:center;
  min-width:0;padding-left:57px}
/* both boxes finish at the card content edge (his call 2026-09-11): the team
   line keeps the base padding, so it is zeroed here for the score to reach it */
.row.mich .tags.mdets{padding-right:0}
/* the separator reads like the header's own bar */
.row.mich .msep{color:var(--muted)}
/* a preseason tournament LOSS: the grey frame goes dashed (his call
   2026-09-13), so a win and a loss in the same tournament read apart */
.row.mich.predash{border-style:dashed}
/* a bye / postseason tile: one card slot, slim on a phone. It carries a FILL
   (his call 2026-09-14) -- outlined alone it read as a hole punched in a
   three-across desktop row. One step above the card, so the row reads as three
   solid blocks and the bye is still the quietest of them. */
.mgap{display:flex;align-items:center;justify-content:center;min-height:38px;
  padding:6px 10px;background:#22222a;
  border:1px solid var(--line);border-radius:9px;color:var(--ink);
  font-size:13px;font-weight:500;letter-spacing:.05em;text-transform:uppercase}
/* ...and its TEXT wears its tournament's colour, the border left alone (his
   call 2026-09-14). NCAA blue manages only 2.5:1 on #22222a, so that one is
   lightened until it reads; the other two clear 4:1 as they are. */
.mgap.g-b1g{color:#0088ce}
.mgap.g-ncaa{color:#4d9ae0}
.mgap.g-cfp{color:#c28c19}
.row.mich .mm .nm{font-size:12.5px;color:var(--muted);font-style:normal}
.row.mdense .meta{grid-template-rows:1fr;min-width:0}
/* Dense: network over time, small, inside one team line -- side by side they
   took 40px from the opponent name on a phone */
.row.mdense .mrow.mstack{flex-direction:column;align-items:flex-end;
  justify-content:center;font-size:11.5px;line-height:1.2}
.t-uni{background:#2c2c31;border-color:#414147;color:#d6d6d1}
.t-uni i{display:inline-block;width:9px;height:9px;border-radius:2px;
  margin-right:5px;vertical-align:-1px;box-shadow:0 0 0 1px #55555c}

.empty{color:var(--muted);text-align:center;padding:44px 10px;font-size:14.5px}
.daterow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 12px}
.daterow input{background:var(--card);border:1px solid var(--line);
  color:var(--ink);border-radius:7px;padding:5px 9px;font:inherit;font-size:14px}
.daterow input:focus-visible{outline:2px solid var(--rank);outline-offset:1px}
.go{background:#2e3a48;border:1px solid #3f5064;color:#cfe0f2;border-radius:7px;
  padding:5px 14px;font:inherit;font-size:14px;font-weight:600;cursor:pointer}
.inarch{color:var(--ok);font-size:11.5px;font-weight:700;letter-spacing:.05em}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:74px;z-index:30;
  background:#2b3a2e;border:1px solid #3d5442;color:#c8e6cf;padding:8px 16px;
  border-radius:8px;font-size:14px;display:none}
.toast.on{display:block}
.toast.bad{background:#3a2a28;border-color:#54413d;color:#e6cdc8}

@media (max-width:560px){
  /* the phone keeps the two columns -- the meta side is only ~90px wide and
     stacking it would lose the away/home alignment that is the point of it */
  .row{column-gap:10px}
  .meta{min-width:78px;padding-left:10px}
  h1{font-size:20px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
